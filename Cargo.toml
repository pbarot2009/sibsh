[package]
name = "sibsh"
version = "0.1.0"
edition = "2024"
authors = ["pbarot2009"]
description = "Something Is Better Shell - A lightweight Unix shell in pure Rust"
license = "Apache-2.0"
repository = "https://github.com/pbarot2009/sibsh"
readme = "README.md"

[dependencies]
# Zero external dependencies for Phase 1.

[lints.rust]
unsafe_code = "allow"
missing_docs = "allow"
unused_must_use = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
must_use_candidate = "allow"
missing_errors_doc = "allow"
similar_names = "allow"
needless_pass_by_value = "allow"
